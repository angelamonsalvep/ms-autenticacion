plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.angelapmonsalve.microservices'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '17' // Ajusta según tu JDK

repositories {
    mavenCentral()
}

ext {
    flywayVersion = '11.10.0' // Asegúrate de que coincide con tu main.gradle
}

dependencies {
	implementation project(':jwt')
    implementation 'software.amazon.awssdk:sts'
    implementation project(':logger')
    implementation project(':sqs-sender')
    implementation project(':metrics')
    implementation 'org.reactivecommons.utils:object-mapper:0.1.0'
    implementation project(':r2dbc-postgresql')
    implementation project(':reactive-web')
    implementation project(':model')
    implementation project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter'
    runtimeOnly('org.springframework.boot:spring-boot-devtools')

    // Flyway para migraciones
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:10.15.0"
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework:spring-web'
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}

springBoot {
    mainClass = 'com.angelapmonsalve.microservices.autenticacion.MainApplication'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    enabled = false // Deshabilita el plain JAR
}

bootJar {
    archiveFileName = "app-service.jar" // Nombre final del bootJar
}