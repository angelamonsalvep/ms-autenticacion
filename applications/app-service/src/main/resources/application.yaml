server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APP_NAME:ms-autenticacion}
  devtools:
    add-properties: false
  r2dbc:
    host: ${SPRING_R2DBC_HOST:localhost}
    port: ${SPRING_R2DBC_PORT:5432}
    database: ${SPRING_R2DBC_DATABASE:autenticacion}
    schema: ${SPRING_R2DBC_SCHEMA:auth}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/autenticacion}
    user: ${SPRING_FLYWAY_USER:postgres}
    password: ${SPRING_FLYWAY_PASSWORD:postgres}
    schemas: ${SPRING_FLYWAY_SCHEMA:auth}
    baseline-on-migrate: true     # 👈 crea baseline si la DB ya tiene tablas
    validate-on-migrate: false    # 👈 evita el error de versión no soportada
    mixed: true                   # 👈 permite SQL y Java-based migrations en conjunto
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aws:
  sqs:
    region: ${AWS_REGION:us-east-1}
    queueUrl: ${AWS_SQS_QUEUE_URL:http://localhost:4566/000000000000/sample}
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:http://localhost:4566}

debug: true